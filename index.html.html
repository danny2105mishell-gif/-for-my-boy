<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart para Cachas</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const PHRASES = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        const SC = 18;
        const OY = 20;
        const SIZES = [10, 11, 12, 13];
        const GAP = 7;
        const FONT = "Arial";

        // Generar puntos del contorno del corazón
        const POLY = [];
        for (let i = 0; i < 720; i++) {
            let a = (2 * Math.PI * i) / 720;
            let x = 16 * Math.pow(Math.sin(a), 3);
            let y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            POLY.push({ x: x * SC, y: y * SC + OY });
        }

        const EDGES = [];
        for (let i = 0; i < POLY.length; i++) {
            EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
        }

        let yMax = Math.max(...POLY.map(p => p.y));
        let yMin = Math.min(...POLY.map(p => p.y));
        let CY = (yMax + yMin) / 2;

        function spans(y) {
            let xs = [];
            for (let [p1, p2] of EDGES) {
                if ((p1.y <= y && y < p2.y) || (p2.y <= y && y < p1.y)) {
                    xs.push(p1.x + (y - p1.y) * (p2.x - p1.x) / (p2.y - p1.y));
                }
            }
            xs.sort((a, b) => a - b);
            let pairs = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (i + 1 < xs.length) {
                    pairs.push([xs[i], xs[i+1]]);
                }
            }
            return pairs;
        }

        function intersect(A, B) {
            let out = [];
            for (let a of A) {
                for (let b of B) {
                    let lo = Math.max(a[0], b[0]);
                    let hi = Math.min(a[1], b[1]);
                    if (hi - lo > 14) {
                        out.push([lo, hi]);
                    }
                }
            }
            return out;
        }

        function buildHeartLines() {
            let placed = [];
            let phraseIndex = 0;
            let rowH = 18;

            let y = yMax - rowH / 2;
            while (y > yMin + rowH / 2) {
                let row = intersect(spans(y + rowH / 2), spans(y - rowH / 2));

                for (let [lo, hi] of row) {
                    lo += 4;
                    hi -= 4;
                    let cur = lo + Math.random() * 8;
                    let line = [];

                    while (true) {
                        let fit = null;
                        for (let attempt = 0; attempt < 10; attempt++) {
                            let text = PHRASES[phraseIndex % PHRASES.length];
                            phraseIndex++;
                            let size = SIZES[Math.floor(Math.random() * SIZES.length)];
                            ctx.font = `bold ${size}px ${FONT}`;
                            let w = ctx.measureText(text).width;
                            if (cur + w <= hi) {
                                fit = { text, size, w };
                                break;
                            }
                        }
                        if (!fit) break;
                        line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
                        cur += fit.w + GAP;
                    }

                    if (line.length === 0) continue;

                    if (line.length > 1) {
                        let left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
                        for (let i = 0; i < line.length; i++) {
                            line[i].x += left * (i / (line.length - 1));
                        }
                    } else {
                        line[0].x = (lo + hi) / 2;
                    }

                    for (let i = 0; i < line.length; i++) {
                        let it = line[i];
                        let dx = it.x;
                        let dy = y;
                        
                        let colors = ["#b3001b", "#e60026", "#ff1a40", "#ff4d6d"];
                        let color = colors[Math.floor(Math.random() * colors.length)];
                        
                        placed.push({ x: dx, y: dy, text: it.text, size: it.size, color: color });
                    }
                }
                y -= rowH;
            }
            return placed;
        }

        const heartItems = buildHeartLines();
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        function draw() {
            ctx.fillStyle = "#060208";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(centerX, centerY);

            for (let item of heartItems) {
                ctx.font = `bold ${item.size}px ${FONT}`;
                ctx.fillStyle = item.color;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                // El -item.y endereza el corazón por completo[cite: 5]
                ctx.fillText(item.text, item.x, -item.y); 
            }

            ctx.restore();
            requestAnimationFrame(draw);
        }

        draw();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
